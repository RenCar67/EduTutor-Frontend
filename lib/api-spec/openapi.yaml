openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: BFF contract for the EduTutor educational tutoring platform (ms-edututor-bff), aligned to the real Spring Boot microservices.
servers:
  - url: /api
    description: Base API path for ms-edututor-bff
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Educational service catalog (ms-edututor-catalog)
  - name: sessions
    description: Tutoring session lifecycle and state machine (ms-edututor-sessions)
  - name: report
    description: Aggregated KPIs and metrics (ms-edututor-report)
  - name: audit
    description: Audit trail events from Kafka (ms-edututor-audit)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ==========================================================================
  # 1. CATALOG CONTROLLER (/api/catalog/...)
  # ==========================================================================
  /catalog/services:
    get:
      operationId: listServices
      tags: [catalog]
      summary: List tutoring services
      responses:
        "200":
          description: Available services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Servicio"

  # ==========================================================================
  # 2. SESSIONS CONTROLLER (/api/sessions/...)
  # ==========================================================================
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List tutoring sessions
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EstadoSesion"
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sesion"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Request a tutoring session (born in SOLICITADA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SesionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"

  /sessions/{id}/status:
    put:
      operationId: transitionSession
      tags: [sessions]
      summary: Transition a session status in the state machine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionStatusInput"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
        "400":
          description: Bad request or validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: IllegalStateTransitionException - invalid state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==========================================================================
  # 3. REPORT CONTROLLER (/api/report/...)
  # ==========================================================================
  /report/kpis:
    get:
      operationId: getReportKpis
      tags: [report]
      summary: Get session throughput by hour, attendance rate and active-state gauges
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            default: last24h
      responses:
        "200":
          description: KPI snapshot for the given range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportKpis"

  /report/top-services:
    get:
      operationId: getTopServices
      tags: [report]
      summary: Get most-requested services for the given range
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            default: last7d
      responses:
        "200":
          description: Top services by request count
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopServicio"

  # ==========================================================================
  # 4. AUDIT CONTROLLER (/api/audit/...)
  # ==========================================================================
  /audit/timeline:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List audit trail events
      parameters:
        - name: usuario
          in: query
          required: false
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventoAuditoria"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EstadoSesion:
      type: string
      description: >
        SOLICITADA -> CONFIRMADA -> ASIGNADA -> EN_CURSO -> REALIZADA, o
        CANCELADA desde cualquier estado previo a EN_CURSO.
      enum: [SOLICITADA, CONFIRMADA, ASIGNADA, EN_CURSO, REALIZADA, CANCELADA]
    EstadoServicio:
      type: string
      enum: [ACTIVO, INACTIVO]
    Servicio:
      type: object
      required: [id, nombre, descripcion, categoria, tutorNombre, precioHora, duracionMinutos, estado, cupoTotal, cupoDisponible, bloqueHorario]
      properties:
        id: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        categoria: { type: string }
        tutorNombre: { type: string }
        precioHora: { type: number }
        duracionMinutos: { type: integer }
        estado: { $ref: "#/components/schemas/EstadoServicio" }
        cupoTotal: { type: integer, description: "Cupos totales del bloque horario" }
        cupoDisponible: { type: integer, description: "Cupos disponibles ahora mismo" }
        bloqueHorario: { type: string, description: "Bloque horario del servicio, ej. 'Lun-Mie 15:00-16:00'" }
    Sesion:
      type: object
      required: [id, servicioId, estudianteId, estado]
      properties:
        id: { type: string }
        servicioId: { type: string }
        estudianteId: { type: string }
        tutorId: { type: string, nullable: true }
        # Denormalizados: ms-edututor-sessions no conoce el catalogo ni un
        # directorio de tutores. El backend no los envia — el frontend los
        # resuelve contra /api/catalog/services (o muestra el tutorId crudo).
        tutorNombre: { type: string, nullable: true }
        servicioNombre: { type: string, nullable: true }
        fechaHora: { type: string, format: date-time, nullable: true }
        fechaSolicitud: { type: string, format: date-time, nullable: true }
        estado: { $ref: "#/components/schemas/EstadoSesion" }
        observaciones: { type: string, nullable: true }
    SesionInput:
      type: object
      required: [servicioId, estudianteId]
      properties:
        servicioId: { type: string }
        estudianteId: { type: string }
        tutorId: { type: string, description: "Tutor preferido, opcional — la sesion igual nace SOLICITADA" }
        fechaHora: { type: string, format: date-time }
        observaciones: { type: string }
    SessionStatusInput:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/EstadoSesion" }
        tutorId: { type: string, description: "Requerido si status=ASIGNADA" }
    SesionesPorHora:
      type: object
      required: [hora, creadas, realizadas, canceladas]
      properties:
        hora: { type: string, format: date-time }
        creadas: { type: integer }
        realizadas: { type: integer }
        canceladas: { type: integer }
    ReportKpis:
      type: object
      required: [range, sesionesPorHora, tasaAsistencia, estadosActivos]
      properties:
        range: { type: string }
        sesionesPorHora:
          type: array
          items:
            $ref: "#/components/schemas/SesionesPorHora"
        tasaAsistencia: { type: number, description: "realizadas / creadas, 0..1" }
        estadosActivos:
          type: object
          additionalProperties:
            type: integer
          description: "Conteo actual de sesiones por estado (gauge)"
    TopServicio:
      type: object
      required: [servicioId, totalSolicitudes]
      properties:
        servicioId: { type: string }
        totalSolicitudes: { type: integer }
    EventoAuditoria:
      type: object
      required: [id, eventoTipo, origen, usuario, fechaTimestamp, payloadJson, resultado]
      properties:
        id: { type: string }
        eventoTipo: { type: string }
        origen: { type: string }
        usuario: { type: string }
        fechaTimestamp: { type: string, format: date-time }
        payloadJson: { type: object, additionalProperties: true }
        resultado: { type: string, enum: [EXITOSO, ERROR] }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        status: { type: integer }
        path: { type: string }
